[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-corsair"
version = "0.3.0"
description = "Linux userspace driver and tray indicator for Corsair (Bragi) wireless headsets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tray = ["PyQt6"]

[project.scripts]
open-corsair = "open_corsair.cli:main"

[tool.setuptools]
packages = ["open_corsair"]

[tool.setuptools.package-data]
open_corsair = ["assets/*.png"]
